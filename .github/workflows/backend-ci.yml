name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint (critical + syntax)
        run: ruff check backend/app backend/tests --select F,E9

      - name: Dependency vulnerability scan (SCA)
        run: pip-audit -r backend/requirements.txt

      - name: Unit tests
        # From backend/ via `python -m` (puts cwd on sys.path) so `app` is importable;
        # a bare `pytest` only adds tests/ itself and fails on `import app`.
        working-directory: backend
        run: python -m pytest tests -q --junitxml=../backend-test-report-${{ matrix.python-version }}.xml

      - name: Build check (bytecode compile)
        run: python -m compileall backend/app

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report-py${{ matrix.python-version }}
          path: backend-test-report-${{ matrix.python-version }}.xml
          retention-days: 14
