services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - allino_data:/app/data
    environment:
      ALLINO_ENV: "production"
      ALLINO_ALLOW_INSECURE_DEV: "false"
      ALLINO_ALLOWED_ORIGINS: "http://localhost:3000"
      ALLINO_DB_PATH: "/app/data/allino.db"
      ALLINO_EVENT_BUS_ENABLED: "${ALLINO_EVENT_BUS_ENABLED:-false}"
      ALLINO_RATE_LIMIT_ENABLED: "true"
      ALLINO_RATE_LIMIT_REQUESTS: "120"
      ALLINO_RATE_LIMIT_WINDOW_SECONDS: "60"
      ALLINO_SECURITY_HEADERS_ENABLED: "true"
      ALLINO_HSTS_ENABLED: "true"
      ALLINO_HSTS_MAX_AGE: "31536000"
      ALLINO_HSTS_INCLUDE_SUBDOMAINS: "true"
      ALLINO_HSTS_PRELOAD: "false"
      ALLINO_EVENT_BUS_ASYNC_CONSUMER_ENABLED: "${ALLINO_EVENT_BUS_ASYNC_CONSUMER_ENABLED:-false}"
      ALLINO_EVENT_BUS_ASYNC_TIMEOUT_SECONDS: "${ALLINO_EVENT_BUS_ASYNC_TIMEOUT_SECONDS:-5}"
      ALLINO_EVENT_BUS_ASYNC_MAX_ATTEMPTS: "${ALLINO_EVENT_BUS_ASYNC_MAX_ATTEMPTS:-3}"
      ALLINO_EVENT_BUS_EXTERNAL_WORKER_ENABLED: "${ALLINO_EVENT_BUS_EXTERNAL_WORKER_ENABLED:-false}"
      ALLINO_EVENT_BUS_EXTERNAL_WORKER_TIMEOUT_SECONDS: "${ALLINO_EVENT_BUS_EXTERNAL_WORKER_TIMEOUT_SECONDS:-5}"
      ALLINO_EVENT_BUS_EXTERNAL_WORKER_MAX_ATTEMPTS: "${ALLINO_EVENT_BUS_EXTERNAL_WORKER_MAX_ATTEMPTS:-3}"
      ALLINO_EVENT_BUS_EXTERNAL_WORKER_BACKOFF_SECONDS: "${ALLINO_EVENT_BUS_EXTERNAL_WORKER_BACKOFF_SECONDS:-0.2}"
      ALLINO_EVENT_BUS_EXTERNAL_WORKER_DLQ_STREAM: "${ALLINO_EVENT_BUS_EXTERNAL_WORKER_DLQ_STREAM:-allino:ingestion:dlq}"
      ALLINO_EVENT_BUS_EXTERNAL_WORKER_FORCE_ERROR_ACTION_PREFIX: "${ALLINO_EVENT_BUS_EXTERNAL_WORKER_FORCE_ERROR_ACTION_PREFIX:-}"
      ALLINO_REDIS_URL: "${ALLINO_REDIS_URL:-redis://redis:6379/0}"
      ALLINO_REDIS_STREAM_PREFIX: "${ALLINO_REDIS_STREAM_PREFIX:-allino:ingestion}"
      ALLINO_ENCRYPTION_AT_REST_ENABLED: "true"
      ALLINO_ENCRYPTION_KEY: "${ALLINO_ENCRYPTION_KEY:-}"
      ALLINO_VAULT_ENABLED: "${ALLINO_VAULT_ENABLED:-false}"
      ALLINO_VAULT_ADDR: "${ALLINO_VAULT_ADDR:-}"
      ALLINO_VAULT_TOKEN: "${ALLINO_VAULT_TOKEN:-}"
      ALLINO_VAULT_MOUNT: "${ALLINO_VAULT_MOUNT:-secret}"
      ALLINO_VAULT_PATH: "${ALLINO_VAULT_PATH:-allino}"
      # Set ALLINO_API_KEY in shell or .env to protect endpoints in shared/prod environments.
      ALLINO_API_KEY: "${ALLINO_API_KEY:-}"
      # Built-in connector tokens -- unset ones simply leave that source unconfigured.
      ALLINO_GITHUB_TOKEN: "${ALLINO_GITHUB_TOKEN:-}"
      ALLINO_GITLAB_TOKEN: "${ALLINO_GITLAB_TOKEN:-}"
      ALLINO_GITLAB_BASE_URL: "${ALLINO_GITLAB_BASE_URL:-}"
      ALLINO_JIRA_TOKEN: "${ALLINO_JIRA_TOKEN:-}"
      ALLINO_JIRA_BASE_URL: "${ALLINO_JIRA_BASE_URL:-}"
      ALLINO_LINEAR_TOKEN: "${ALLINO_LINEAR_TOKEN:-}"
      ALLINO_TELEGRAM_BOT_TOKEN: "${ALLINO_TELEGRAM_BOT_TOKEN:-}"
      ALLINO_SLACK_BOT_TOKEN: "${ALLINO_SLACK_BOT_TOKEN:-}"
      ALLINO_SLACK_CHANNEL_ID: "${ALLINO_SLACK_CHANNEL_ID:-}"
      ALLINO_DISCORD_BOT_TOKEN: "${ALLINO_DISCORD_BOT_TOKEN:-}"
      ALLINO_DISCORD_CHANNEL_ID: "${ALLINO_DISCORD_CHANNEL_ID:-}"
      ALLINO_ZOOM_TOKEN: "${ALLINO_ZOOM_TOKEN:-}"
      ALLINO_TEAMS_TOKEN: "${ALLINO_TEAMS_TOKEN:-}"
      ALLINO_ROCKETCHAT_TOKEN: "${ALLINO_ROCKETCHAT_TOKEN:-}"
      ALLINO_ROCKETCHAT_USER_ID: "${ALLINO_ROCKETCHAT_USER_ID:-}"
      ALLINO_ROCKETCHAT_BASE_URL: "${ALLINO_ROCKETCHAT_BASE_URL:-}"
      ALLINO_ROCKETCHAT_CHANNEL_ID: "${ALLINO_ROCKETCHAT_CHANNEL_ID:-}"
      ALLINO_ADMIN_TOTP_SECRET: "${ALLINO_ADMIN_TOTP_SECRET:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  event_bus_worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.event_bus_worker"]
    depends_on:
      - redis
    volumes:
      - allino_data:/app/data
    environment:
      ALLINO_DB_PATH: "/app/data/allino.db"
      ALLINO_REDIS_URL: "${ALLINO_REDIS_URL:-redis://redis:6379/0}"
      ALLINO_REDIS_STREAM_PREFIX: "${ALLINO_REDIS_STREAM_PREFIX:-allino:ingestion}"
      ALLINO_EVENT_BUS_EXTERNAL_WORKER_MAX_ATTEMPTS: "${ALLINO_EVENT_BUS_EXTERNAL_WORKER_MAX_ATTEMPTS:-3}"
      ALLINO_EVENT_BUS_EXTERNAL_WORKER_BACKOFF_SECONDS: "${ALLINO_EVENT_BUS_EXTERNAL_WORKER_BACKOFF_SECONDS:-0.2}"
      ALLINO_EVENT_BUS_EXTERNAL_WORKER_DLQ_STREAM: "${ALLINO_EVENT_BUS_EXTERNAL_WORKER_DLQ_STREAM:-allino:ingestion:dlq}"
      ALLINO_EVENT_BUS_EXTERNAL_WORKER_FORCE_ERROR_ACTION_PREFIX: "${ALLINO_EVENT_BUS_EXTERNAL_WORKER_FORCE_ERROR_ACTION_PREFIX:-}"
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.event_bus_worker", "--healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 3

  scheduler_worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.scheduler_worker"]
    volumes:
      - allino_data:/app/data
    environment:
      ALLINO_DB_PATH: "/app/data/allino.db"
      ALLINO_SCHEDULER_WORKER_POLL_INTERVAL_SECONDS: "${ALLINO_SCHEDULER_WORKER_POLL_INTERVAL_SECONDS:-30}"
      ALLINO_GOOGLE_CALENDAR_POLL_ENABLED: "${ALLINO_GOOGLE_CALENDAR_POLL_ENABLED:-false}"
      ALLINO_GOOGLE_CALENDAR_POLL_INTERVAL_SECONDS: "${ALLINO_GOOGLE_CALENDAR_POLL_INTERVAL_SECONDS:-900}"
      ALLINO_GOOGLE_CALENDAR_POLL_TENANT_ID: "${ALLINO_GOOGLE_CALENDAR_POLL_TENANT_ID:-}"
      ALLINO_GOOGLE_CALENDAR_POLL_CALENDAR_ID: "${ALLINO_GOOGLE_CALENDAR_POLL_CALENDAR_ID:-primary}"
      ALLINO_GOOGLE_CALENDAR_TOKEN: "${ALLINO_GOOGLE_CALENDAR_TOKEN:-}"
      # Auto-poll for the other built-in named connectors -- see docker-compose's
      # `backend` service above for what each token env var is for.
      ALLINO_BUILTIN_CONNECTORS_POLL_ENABLED: "${ALLINO_BUILTIN_CONNECTORS_POLL_ENABLED:-false}"
      ALLINO_BUILTIN_CONNECTORS_POLL_INTERVAL_SECONDS: "${ALLINO_BUILTIN_CONNECTORS_POLL_INTERVAL_SECONDS:-300}"
      ALLINO_BUILTIN_CONNECTORS_POLL_TENANT_ID: "${ALLINO_BUILTIN_CONNECTORS_POLL_TENANT_ID:-}"
      ALLINO_GITHUB_TOKEN: "${ALLINO_GITHUB_TOKEN:-}"
      ALLINO_GITLAB_TOKEN: "${ALLINO_GITLAB_TOKEN:-}"
      ALLINO_GITLAB_BASE_URL: "${ALLINO_GITLAB_BASE_URL:-}"
      ALLINO_JIRA_TOKEN: "${ALLINO_JIRA_TOKEN:-}"
      ALLINO_JIRA_BASE_URL: "${ALLINO_JIRA_BASE_URL:-}"
      ALLINO_LINEAR_TOKEN: "${ALLINO_LINEAR_TOKEN:-}"
      ALLINO_TELEGRAM_BOT_TOKEN: "${ALLINO_TELEGRAM_BOT_TOKEN:-}"
      ALLINO_SLACK_BOT_TOKEN: "${ALLINO_SLACK_BOT_TOKEN:-}"
      ALLINO_SLACK_CHANNEL_ID: "${ALLINO_SLACK_CHANNEL_ID:-}"
      ALLINO_DISCORD_BOT_TOKEN: "${ALLINO_DISCORD_BOT_TOKEN:-}"
      ALLINO_DISCORD_CHANNEL_ID: "${ALLINO_DISCORD_CHANNEL_ID:-}"
      ALLINO_ZOOM_TOKEN: "${ALLINO_ZOOM_TOKEN:-}"
      ALLINO_TEAMS_TOKEN: "${ALLINO_TEAMS_TOKEN:-}"
      ALLINO_ROCKETCHAT_TOKEN: "${ALLINO_ROCKETCHAT_TOKEN:-}"
      ALLINO_ROCKETCHAT_USER_ID: "${ALLINO_ROCKETCHAT_USER_ID:-}"
      ALLINO_ROCKETCHAT_BASE_URL: "${ALLINO_ROCKETCHAT_BASE_URL:-}"
      ALLINO_ROCKETCHAT_CHANNEL_ID: "${ALLINO_ROCKETCHAT_CHANNEL_ID:-}"
      ALLINO_ENCRYPTION_AT_REST_ENABLED: "true"
      ALLINO_ENCRYPTION_KEY: "${ALLINO_ENCRYPTION_KEY:-}"
      ALLINO_VAULT_ENABLED: "${ALLINO_VAULT_ENABLED:-false}"
      ALLINO_VAULT_ADDR: "${ALLINO_VAULT_ADDR:-}"
      ALLINO_VAULT_TOKEN: "${ALLINO_VAULT_TOKEN:-}"
      ALLINO_VAULT_MOUNT: "${ALLINO_VAULT_MOUNT:-secret}"
      ALLINO_VAULT_PATH: "${ALLINO_VAULT_PATH:-allino}"
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.scheduler_worker", "--healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* vars are baked at build time — pass as build args, not runtime env.
      args:
        NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}"
        NEXT_PUBLIC_TENANT_ID: "${NEXT_PUBLIC_TENANT_ID:-tenant_demo}"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  allino_data:
